# Databricks Asset Bundle for the same pipeline.
# NOTE: provided for deployment, NOT run on a Databricks workspace (no workspace was available).
# Validate with `databricks bundle validate -t dev` once a workspace profile exists.
bundle:
  name: clinical-graphrag-gxp

include:
  - resources/*.yml

artifacts:
  cgg_wheel:
    type: whl
    path: .
    build: python -m build --wheel

variables:
  catalog:
    description: Unity Catalog catalog for the medallion tables
    default: cgg_dev
  neo4j_secret_scope:
    description: Secret scope holding neo4j-uri, neo4j-user, neo4j-password
    default: cgg
  llm_endpoint:
    description: Model Serving endpoint used instead of the local Ollama container
    default: databricks-meta-llama-3-1-8b-instruct

targets:
  dev:
    mode: development
    default: true
  validation:
    mode: production
    variables:
      catalog: cgg_val
