# Local services for clinical-graphrag-gxp. Everything binds to 127.0.0.1.
# Secrets come from infra/.env (gitignored); see infra/.env.example and scripts/init_env.py.
name: cgg

services:
  neo4j:
    image: neo4j:5-community
    container_name: cgg-neo4j
    environment:
      NEO4J_AUTH: neo4j/${CGG_NEO4J_PASSWORD:?set in infra/.env}
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    volumes:
      - neo4j_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: cgg-ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    ports:
      - "127.0.0.1:11501:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  langfuse-db:
    image: postgres:16-alpine
    container_name: cgg-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?set in infra/.env}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      retries: 20

  langfuse:
    image: langfuse/langfuse:2
    container_name: cgg-langfuse
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in infra/.env}
      SALT: ${LANGFUSE_SALT:?set in infra/.env}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      # Headless initialisation: org, project, API keys and one local admin user.
      LANGFUSE_INIT_ORG_ID: cgg-org
      LANGFUSE_INIT_ORG_NAME: clinical-graphrag-gxp
      LANGFUSE_INIT_PROJECT_ID: cgg-project
      LANGFUSE_INIT_PROJECT_NAME: clinical-graphrag-qa
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?set in infra/.env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?set in infra/.env}
      LANGFUSE_INIT_USER_EMAIL: admin@cgg.local
      LANGFUSE_INIT_USER_NAME: cgg-admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:?set in infra/.env}

volumes:
  neo4j_data:
    name: cgg_neo4j_data
  langfuse_pg:
    name: cgg_langfuse_pg
  ollama_models:
    # External on purpose, so `docker compose down -v` never deletes downloaded models.
    # Create it once with `docker volume create cgg_ollama`, or point OLLAMA_VOLUME at an existing one.
    external: true
    name: ${OLLAMA_VOLUME:-cgg_ollama}
