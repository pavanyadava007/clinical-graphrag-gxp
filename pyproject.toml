[project]
name = "clinical-graphrag-gxp"
version = "0.1.0"
description = "Drug-label question answering with GraphRAG on Neo4j, guardrails, human review, MLflow lineage, Langfuse tracing and a GxP-style validation package"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Pavan Yadav Annappa" }]
dependencies = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "mlflow>=3.1,<3.6",
    "sqlalchemy>=2.0,<2.1",  # mlflow 3.5 imports a pool class removed in SQLAlchemy 2.1
    "langfuse>=2.50,<3",
    "neo4j>=5.20,<6",
    "httpx>=0.27",
    "pyyaml>=6",
    "pandas>=2",
    "pyarrow>=15",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "Pillow>=10", "huggingface_hub>=0.24"]

[project.scripts]
cgg = "cgg.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cgg", "cgg.pipeline", "cgg.graph", "cgg.systems", "cgg.validation"]

[tool.setuptools.package-data]
cgg = ["prompts/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "req(id): links an OQ test to a URS requirement id (traceability)",
    "integration: needs running Neo4j / Ollama / Langfuse services",
    "spark: needs Java + PySpark (runs the pipeline on a small fixture)",
]
addopts = "-q"
